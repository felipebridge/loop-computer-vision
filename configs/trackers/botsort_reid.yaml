tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
# 120 frames = 2s of buffer at 60fps: in a dense multi-lane jam a vehicle can stay fully
# occluded behind a neighbor for well over the 1s the previous value (60) covered, which was
# expiring its track (and handing it a new ID once it re-emerged) before ReID got a chance.
track_buffer: 120
match_thresh: 0.8
fuse_score: true

gmc_method: sparseOptFlow

proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: true
model: auto
