video:
  fps_override: null
  tone_map_hdr: true

detection:
  model_path: "yolo11l.pt"
  confidence_threshold: 0.2
  # Raised from 0.5: with many vehicles side-by-side or overlapping in a dense scene, standard
  # NMS at 0.5 was merging/suppressing adjacent vehicle boxes down to whichever pair was most
  # cleanly separated, undercounting how many vehicles show as detected at once.
  iou_threshold: 0.65
  # Raised from 1280 (see settings.py note). Validated against this project's dense-traffic
  # footage: at 1280-1600 the far-lane traffic jam (small, distant vehicles) was almost entirely
  # missed (single-frame test: 30 vehicle boxes at 1280 vs 43 at 2016 on the same frame). 2016
  # recovered the most detail but repeatedly ran this machine (14GB RAM, shared with a browser,
  # an IDE, and this CLI itself) out of memory mid-run at yolo11l's activation-memory footprint;
  # 1536 is a deliberate compromise -- less far-lane recall than 2016 would give, but enough
  # headroom on this machine to actually finish a full run instead of getting OOM-killed partway
  # through. Raise it back to 2016 on a machine with more free RAM (or with less else running).
  imgsz: 1536
  vehicle_classes: ["car", "bus", "truck", "motorcycle", "bicycle"]
  person_class: "person"
  device: "auto"
  # The park statue on its pedestal (left side of frame, inside the fenced garden bed) reads to
  # the detector as a person -- higher confidence and less frame-to-frame motion than several
  # real, legitimately-still pedestrians elsewhere in this same clip (see
  # analytics.zone_filter), so neither a confidence nor a movement threshold can single it out
  # without also dropping real people. Measured directly off this camera's framing: the pedestal
  # sits inside the garden fence, well clear of the path real pedestrians actually walk on.
  excluded_zones: [[0.21, 0.32, 0.27, 0.47]]

tracking:
  tracker: "botsort"
  appearance_reid_enabled: true
  min_track_seconds: 0.3
  # Lowered from 0.6: in dense multi-vehicle traffic, mutual occlusion between neighboring
  # vehicles was dropping real, frequently-visible tracks that dipped just under the old bar.
  min_visibility_ratio: 0.5
  reid_max_gap_seconds: 1.0
  reid_max_centroid_distance_ratio: 0.06
  # Disabled (0.0): this ratio excludes tracks whose (camera-motion-compensated) position
  # barely moves, meant to filter out curb-parked cars. `CameraMotionEstimator` masking (see
  # analytics.motion_compensation) fixed the RANSAC contamination that was corrupting this
  # signal (~15% -> ~2% spurious drift on this footage), but re-enabling it at any threshold
  # that actually excludes a parked car (tried: 0.035) also excluded the ENTIRE far lane of
  # this avenue's traffic jam -- confirmed by inspecting the annotated output, not just theory.
  # The reason is perspective, not compensation: a distant, slow-moving vehicle covers very
  # few *screen* pixels per real meter it travels, so at the far lane's distance its on-screen
  # displacement over this clip's ~16s is barely above the noise floor a genuinely parked car
  # also produces -- the two become indistinguishable from raw displacement alone. Recall on
  # that far lane (most of the traffic in this scene) matters more than excluding the handful
  # of curb-parked cars, so this stays off. Excluding specific parked cars reliably would need
  # a position-based signal (e.g. a marked parking-lane/lot region) instead of a motion-based
  # one -- see docs/architecture.md.
  min_movement_ratio: 0.0

congestion:
  # Raised from moderate:6/high:14 -- those were never validated against this project's actual
  # wide-avenue footage. Measured from tracks.csv on this avenue (Av. Figueroa Alcorta, ~6
  # lanes): simultaneous vehicle count sits at 38-45 for nearly the entire clip (mean ~41), not
  # a brief spike -- a wide multi-lane avenue simply has more cars in frame at once than a
  # narrow street even at normal, non-congested flow, since density here isn't normalized by
  # lane count. moderate:20 keeps a real light-traffic floor (well below this avenue's normal
  # range) while giving room for busier-than-usual footage below true saturation; high:55 sits
  # above this avenue's observed peak (45) so HIGH is reserved for saturation beyond what this
  # normal-flow footage ever reaches, rather than triggering on this avenue's baseline density.
  density_thresholds:
    moderate: 20
    high: 55
  persistence_frames: 15

output:
  output_dir: "outputs"
  save_annotated_video: true

speed:
  enabled: true
  reference_widths_m:
    car: 1.8
    bus: 2.5
    truck: 2.5
    motorcycle: 0.8
    bicycle: 0.6
  min_calibration_samples: 30
