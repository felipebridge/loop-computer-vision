[project]
name = "traffic-intelligence"
version = "0.1.0"
description = "Computer vision pipeline that counts vehicles and pedestrians and classifies traffic congestion from video."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Felipe" }]

dependencies = [
    "ultralytics>=8.3.0,<9.0.0",
    "lap>=0.5.12,<1.0.0",
    "opencv-python-headless>=4.10.0,<5.0.0",
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.2.0,<3.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "PyYAML>=6.0.1,<7.0.0",
    "streamlit>=1.37.0,<2.0.0",
    "altair>=5.3.0,<6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "ruff>=0.5.0,<1.0.0",
]

[project.scripts]
traffic-intelligence = "traffic_intelligence.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/traffic_intelligence/cli.py" = ["I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
